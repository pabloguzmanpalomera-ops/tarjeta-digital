
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spot Comunicación Audiovisual</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#e9ecef;
display:flex;
justify-content:center;
padding:25px;
}

.card{
width:100%;
max-width:430px;
background:white;
border-radius:28px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.cover{
height:140px;
background:linear-gradient(135deg,#111,#333);
}

.profile{
display:flex;
justify-content:center;
margin-top:-55px;
}

.profile img{
width:110px;
height:110px;
border-radius:50%;
border:5px solid white;
object-fit:cover;
background:#ddd;
}

.content{
padding:20px;
text-align:center;
}

h1{
font-size:24px;
margin-top:10px;
}

.subtitle{
color:#666;
font-size:15px;
margin-top:8px;
line-height:1.5;
}

.buttons{
margin-top:22px;
display:flex;
flex-direction:column;
gap:12px;
}

.btn{
text-decoration:none;
padding:15px;
border-radius:14px;
font-weight:bold;
font-size:16px;
display:block;
}

.whatsapp{
background:#25D366;
color:white;
}

.dark{
background:#111;
color:white;
}

.light{
background:#f1f1f1;
color:#111;
}

.footer{
padding:18px;
font-size:12px;
color:#888;
text-align:center;
}
</style>
</head>

<body>

<div class="card">

<div class="cover"></div>

<div class="profile">
<img src="foto.jpg">
</div>

<div class="content">

<h1>SPOT COMUNICACIÓN AUDIOVISUAL</h1>

<p class="subtitle">
Producción Audiovisual<br>
Marketing Digital<br>
Puerto Vallarta, Jalisco
</p>

<div class="buttons">

<a class="btn whatsapp"
href="https://wa.me/521XXXXXXXXXX"
target="_blank">
WhatsApp
</a>

<a class="btn dark"
href="tel:+52XXXXXXXXXX">
Llamar
</a>

<a class="btn dark"
href="mailto:pablo_guzman@hotmail.com">
Enviar Email
</a>

<a class="btn light"
href="https://instagram.com/spotcomunicacionaudiovisual"
target="_blank">
Instagram
</a>

<a class="btn light"
href="https://facebook.com/SPOTComunicacionAudiovisual"
target="_blank">
Facebook
</a>

<a class="btn dark"
href="https://www.spotk.com.mx"
target="_blank">
Ver Portafolio
</a>

<a class="btn light"
href="https://maps.google.com/?q=Puerto+Vallarta">
Ubicación
</a>

<a class="btn dark"
href="vcard.vcf">
Guardar mi contacto
</a>

</div>

</div>

<div class="footer">
© 2026 Spot Comunicación Audiovisual
</div>

</div>

</body>
</html>
